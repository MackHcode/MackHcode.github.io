     <script>
        function playAudio(id) {
            const audio = document.getElementById(id);
            document.querySelectorAll('#favorite-artists audio').forEach(a => {
                if (a !== audio) {
                    a.pause();
                    a.currentTime = 0;
                }
            });
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }
    </script>
