   <body>
	 <!-- Hidden background music -->
    <audio id="background-music" loop>
        <source src="media/moonlightcoffee.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <!-- Hidden click sound -->
    <audio id="click-sound" loop>
        <source src="media/clicksound.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <!-- Mute/unmute button -->
    <button onclick="toggleMute()" style="position: fixed; top: 10px; right: 10px; z-index: 100;">
        Mute/Unmute Music
    </button>

    <script>
        const bgMusic = document.getElementById("background-music");
        const clickSound = document.getElementById("click-sound");

        // Start music after first click (bypasses autoplay restrictions)
        document.addEventListener("click", function startMusic() {
            if (bgMusic.paused) {
                bgMusic.play().catch(err => console.log("Autoplay blocked:", err));
            }
            document.removeEventListener("click", startMusic);
        });

        // Restore music time if available
        window.addEventListener("load", () => {
            const savedTime = sessionStorage.getItem("musicTime");
            if (savedTime) {
                bgMusic.currentTime = parseFloat(savedTime);
                bgMusic.play().catch(() => {});
            }
        });

        // Save music time before leaving page
        window.addEventListener("beforeunload", () => {
            sessionStorage.setItem("musicTime", bgMusic.currentTime);
        });

        // Toggle mute button
        function toggleMute() {
            bgMusic.muted = !bgMusic.muted;
        }

        // Play click sound before navigation
        document.querySelectorAll("nav a").forEach(link => {
            link.addEventListener("click", (event) => {
                event.preventDefault(); // stop instant nav
                const href = link.getAttribute("href");

                // play click sound
                clickSound.currentTime = 0;
                clickSound.play().catch(err => console.log("Click sound blocked:", err));

                // navigate after short delay (longer so sound is audible)
                setTimeout(() => {
                    window.location.href = href;
                }, 150); 
            });
        });
    </script>
